# Baked into the wrapper chart (part of what we test and promote).
# validationFailureAction is tier config: tiers/<tier>/tier.yaml.
kyverno-policies:
  podSecurityStandard: baseline
  # kind's volume provisioner runs helper pods with hostPath mounts in local-path-storage
  # (cluster infrastructure). Without this, no volume can be provisioned where Enforce.
  vpolExcludeByPolicy:
    disallow-host-path:
      excludeNamespaces: [local-path-storage]

# Our Helm tests.
promoTest:
  image: alpine/kubectl:1.37.2@sha256:1a7fc3308a8eee1c8bd177930fc521088c6dc64ad8b68c88319151fd87d79deb
