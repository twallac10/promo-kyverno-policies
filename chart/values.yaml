# Baked into the wrapper chart (part of what we test and promote).
# validationFailureAction is tier config: tiers/<tier>/tier.yaml.
kyverno-policies:
  podSecurityStandard: baseline
  # kind's volume provisioner creates helper pods with hostPath mounts (cluster
  # infrastructure); without this no volume can be provisioned where Enforce.
  # Only pods the provisioner's own service account creates in its namespace.
  vpolExcludeByPolicy:
    disallow-host-path:
      matchConditions:
        - name: exempt-local-path-provisioner
          expression: "!(request.namespace == 'local-path-storage' && request.userInfo.username == 'system:serviceaccount:local-path-storage:local-path-provisioner-service-account')"

# Our Helm tests.
promoTest:
  image: alpine/kubectl:1.37.2@sha256:1a7fc3308a8eee1c8bd177930fc521088c6dc64ad8b68c88319151fd87d79deb
